[package]
name = "nrmlz"
description = "Text normalisation for speech synthesis: numbers, dates, units, abbreviations and markup as spoken words"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["src/**", "data/**", "build.rs", "Cargo.toml"]

[features]
default = ["lexicon-toml", "lexicon-json"]
# Load lexicons from TOML / JSON text.
lexicon-toml = ["dep:serde", "dep:toml"]
lexicon-json = ["dep:serde", "dep:serde_json"]
# Count pattern matches (rule coverage report of the differential test).
coverage = []
# Run the exact translation next to the native one on every search and assert identical matches (tests).
verify-native = []

[dependencies]
fancy-regex.workspace = true
regex-syntax.workspace = true
regex-automata.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[build-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
proptest = "1.12"
regex.workspace = true
serde_json = "1"
